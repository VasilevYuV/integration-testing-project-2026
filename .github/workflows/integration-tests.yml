name: Java integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify on Java 25
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out sources
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Record build environment
        run: |
          mkdir -p "$RUNNER_TEMP/kt8"
          {
            java --version
            mvn --version
            printf 'Commit: %s\nRef: %s\nRun: %s\nAttempt: %s\n' \
              "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } 2>&1 | tee "$RUNNER_TEMP/kt8/environment.log"

      - name: Build and run all tests
        id: verify
        run: |
          mvn --batch-mode --no-transfer-progress --fail-at-end \
            -Dstyle.color=never clean verify 2>&1 | tee "$RUNNER_TEMP/kt8/maven-verify.log"

      - name: Summarize test results
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          MAVEN_OUTCOME: ${{ steps.verify.outcome }}
        run: python3 .github/scripts/summarize_tests.py --output "$RUNNER_TEMP/kt8"

      - name: Upload test reports and service logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/kt8/
