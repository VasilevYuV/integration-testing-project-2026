spring.application.name=order-service
server.address=127.0.0.1
server.port=${ORDER_SERVICE_PORT:18082}
spring.datasource.url=jdbc:h2:mem:orders
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
clients.users.base-url=${USER_SERVICE_URL:http://127.0.0.1:18081}
clients.users.connect-timeout=${USER_SERVICE_CONNECT_TIMEOUT:1s}
clients.users.read-timeout=${USER_SERVICE_READ_TIMEOUT:2s}
